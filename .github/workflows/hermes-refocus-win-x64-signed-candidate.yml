# Hermes Refocus signed candidate lane — deliberately DISABLED until external gates below are verified.
# Never publish: the signed MSIX is a public run artifact in this public fork.
# The build job executes candidate code and has no signing credentials. The signer
# job does not checkout the candidate repository or run any candidate-provided code.
name: Hermes Refocus Windows x64 signed candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character commit SHA on refocus/mis-perfiles
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hermes-refocus-signed-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    name: Build unsigned candidate (NO signing secrets)
    if: github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/hermes-refocus-win-x64-signed-candidate.yml@refs/heads/main', github.repository)
    runs-on: windows-latest
    timeout-minutes: 600
    permissions:
      contents: read
    outputs:
      epoch: ${{ steps.epoch.outputs.value }}
    env:
      BUILD_SHA: ${{ inputs.ref }}
      CLOUDFLARE_R2_PUBLIC_URL: ''
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact candidate ancestry (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::ref must be lowercase full 40-character SHA'; exit 1; }
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          git fetch --no-tags origin refocus/mis-perfiles:refs/remotes/origin/refocus/mis-perfiles
          git merge-base --is-ancestor "$BUILD_SHA" origin/refocus/mis-perfiles || { echo '::error::candidate is not admitted branch ancestry'; exit 1; }
          echo "admitted candidate $BUILD_SHA"
      - name: Pin package build epoch
        id: epoch
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(date -u +%s)"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          echo "HERMES_RELEASE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "value=$epoch" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Prepare unsigned Refocus build
        shell: bash
        env:
          HERMES_DESKTOP_VARIANT: refocus
          HERMES_BUILD_COMMIT: ${{ env.BUILD_SHA }}
          HERMES_RELEASE_EPOCH: ${{ env.HERMES_RELEASE_EPOCH }}
          # Public variable is only a build input; signer compares it to a hard-coded pin.
          HERMES_MSIX_PUBLISHER: ${{ vars.REFOCUS_MSIX_EXPECTED_SUBJECT }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          test -n "$HERMES_MSIX_PUBLISHER" || { echo '::error::expected certificate subject variable is unset'; exit 1; }
          python scripts/bundles/desktop.py --commit "$HERMES_BUILD_COMMIT" --variant refocus --prepare-only --work "$RUNNER_TEMP/desktop-job" --cache "$RUNNER_TEMP/desktop-inputs"
      - name: Package unsigned candidate
        shell: bash
        env:
          HERMES_DESKTOP_VARIANT: refocus
          HERMES_BUILD_COMMIT: ${{ env.BUILD_SHA }}
          HERMES_RELEASE_EPOCH: ${{ env.HERMES_RELEASE_EPOCH }}
          HERMES_MSIX_PUBLISHER: ${{ vars.REFOCUS_MSIX_EXPECTED_SUBJECT }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python scripts/bundles/desktop.py --prepared "$RUNNER_TEMP/desktop-job/prepared.json" --variant refocus
      - name: Upload unsigned package as data only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-refocus-unsigned-${{ env.BUILD_SHA }}
          path: apps/desktop/release/HermesRefocus*.msix
          if-no-files-found: error
          retention-days: 3

  sign-candidate:
    name: Validate data then sign (protected, fail-closed)
    needs: build-candidate
    # The branch/ref checks prevent a feature-branch or PR workflow from ever
    # attaching the environment/secrets. Repository variables are an additional
    # administrative OFF switch; unset by default. They do NOT prove protection.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == format('{0}/.github/workflows/hermes-refocus-win-x64-signed-candidate.yml@refs/heads/main', github.repository) &&
      vars.REFOCUS_SIGNING_ENABLED == 'I_VERIFIED_ENVIRONMENT_AND_BRANCH_PROTECTION'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: refocus-signed-canary
    permissions:
      actions: read
      contents: read
    steps:
      # No checkout, no Node/Python/package scripts, and no tools from the candidate artifact.
      - name: Download this run's exact build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hermes-refocus-unsigned-${{ inputs.ref }}
          path: ${{ runner.temp }}/candidate
      - name: Refuse unpinned certificate configuration before secret use
        shell: pwsh
        env:
          PINNED_THUMBPRINT: 'F07F1CDCCE95D48EB53ED0AAA0CF29610B8F55B6'
          PINNED_SUBJECT: 'CN=Refocus Development'
          CONFIGURED_SUBJECT: ${{ vars.REFOCUS_MSIX_EXPECTED_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PINNED_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$' -or $env:PINNED_SUBJECT -like 'SET_FIXED_*') {
            throw 'Fixed signer thumbprint/subject pins are unset; signing is disabled.'
          }
          if ($env:CONFIGURED_SUBJECT -cne $env:PINNED_SUBJECT) { throw 'Configured build subject does not byte-match fixed signer subject.' }
      - name: Validate unsigned package data (no code execution)
        id: package
        shell: pwsh
        env:
          PINNED_SUBJECT: 'CN=Refocus Development'
          CONFIGURED_SUBJECT: ${{ vars.REFOCUS_MSIX_EXPECTED_SUBJECT }}
          BUILD_EPOCH: ${{ needs.build-candidate.outputs.epoch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem "$env:RUNNER_TEMP/candidate" -Filter 'HermesRefocus*.msix' -File)
          if ($files.Count -ne 1) { throw "Expected exactly one MSIX, got $($files.Count)." }
          $msix = $files[0]
          $sig = Get-AuthenticodeSignature -LiteralPath $msix.FullName
          if ($sig.Status -ne 'NotSigned') { throw "Input must be unsigned; status was $($sig.Status)." }
          $inspect = Join-Path $env:RUNNER_TEMP 'msix-inspect'
          $zip = Join-Path $env:RUNNER_TEMP 'candidate-inspect.zip'
          Copy-Item -LiteralPath $msix.FullName -Destination $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $inspect
          [xml]$manifest = Get-Content -LiteralPath (Join-Path $inspect 'AppxManifest.xml')
          $identity = $manifest.Package.Identity
          if ($identity.Name -cne 'Refocus.HermesRefocus') { throw "Unexpected package Name '$($identity.Name)'." }
          if ($identity.Publisher -cne $env:PINNED_SUBJECT -or $identity.Publisher -cne $env:CONFIGURED_SUBJECT) { throw 'Package Publisher does not exactly match the pinned subject.' }
          if ($identity.Version -notmatch '^[1-9][0-9]*\.[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid package version '$($identity.Version)'." }
          if (($identity.Version -split '\.') | Where-Object { [int64]$_ -gt 65535 }) { throw 'Package version component exceeds MSIX 16-bit limit.' }
          if ($env:BUILD_EPOCH -notmatch '^\d+$') { throw 'Trusted build epoch output is missing.' }
          $date = [DateTimeOffset]::FromUnixTimeSeconds([int64]$env:BUILD_EPOCH).UtcDateTime
          $expectedVersion = '{0}.{1}.{2}.{3}' -f ($date.Year % 100), (($date.Month * 100) + $date.Day), $date.Hour, (($date.Minute * 100) + $date.Second)
          if ($identity.Version -cne $expectedVersion) { throw "Package version '$($identity.Version)' does not match trusted build epoch '$expectedVersion'." }
          "MSIX=$($msix.FullName)" | Add-Content $env:GITHUB_OUTPUT
          "VERSION=$($identity.Version)" | Add-Content $env:GITHUB_OUTPUT
      - name: Sign with the protected PFX (signtool)
        shell: pwsh
        env:
          HERMES_MSIX_PFX_B64: ${{ secrets.HERMES_MSIX_PFX_B64 }}
          HERMES_MSIX_PFX_PASSWORD: ${{ secrets.HERMES_MSIX_PFX_PASSWORD }}
          PINNED_THUMBPRINT: 'F07F1CDCCE95D48EB53ED0AAA0CF29610B8F55B6'
          PINNED_SUBJECT: 'CN=Refocus Development'
          MSIX: ${{ steps.package.outputs.MSIX }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:HERMES_MSIX_PFX_B64) -or [string]::IsNullOrWhiteSpace($env:HERMES_MSIX_PFX_PASSWORD)) { throw 'PFX secrets are missing.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'refocus-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:HERMES_MSIX_PFX_B64))
            $secure = ConvertTo-SecureString $env:HERMES_MSIX_PFX_PASSWORD -AsPlainText -Force
            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $secure, [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            if ($cert.Thumbprint -cne $env:PINNED_THUMBPRINT -or $cert.Subject -cne $env:PINNED_SUBJECT) { throw 'PFX leaf certificate does not match fixed thumbprint and subject pins.' }
            # Trust only the independently pinned public certificate for this
            # ephemeral runner's self-signed-chain verification. Never import
            # the PFX/private key into the machine certificate store.
            $publicCert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            $store = [Security.Cryptography.X509Certificates.X509Store]::new('Root', 'LocalMachine')
            $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            $store.Add($publicCert)
            $store.Close()
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Filter signtool.exe -Recurse -ErrorAction Stop | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'Windows SDK signtool.exe not found.' }
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:HERMES_MSIX_PFX_PASSWORD /sha1 $env:PINNED_THUMBPRINT $env:MSIX
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE." }
            # Independently read back signature status and leaf identity after signing.
            $result = Get-AuthenticodeSignature -LiteralPath $env:MSIX
            if ($result.Status -ne 'Valid') { throw "Post-sign Authenticode status was $($result.Status), expected Valid." }
            if (-not $result.SignerCertificate -or $result.SignerCertificate.Thumbprint -cne $env:PINNED_THUMBPRINT -or $result.SignerCertificate.Subject -cne $env:PINNED_SUBJECT) { throw 'Post-sign signer certificate does not match fixed thumbprint and subject.' }
            & $signtool.FullName verify /pa /all /v $env:MSIX
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE." }
            "Signed package and verified fixed signer $($result.SignerCertificate.Subject)."
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            Remove-Item Env:HERMES_MSIX_PFX_B64 -ErrorAction SilentlyContinue
            Remove-Item Env:HERMES_MSIX_PFX_PASSWORD -ErrorAction SilentlyContinue
          }
      - name: Upload signed artifact only (no publishing)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-refocus-signed-${{ inputs.ref }}
          path: ${{ steps.package.outputs.MSIX }}
          if-no-files-found: error
          retention-days: 3

# REQUIRED before enabling (currently impossible and intentionally gated OFF):
# 1. Protect default branch `main`; restrict .github/workflows changes to trusted reviewers.
# 2. Create `refocus-signed-canary` in repository Settings with required independent
#    reviewers, prevent self-review, restrict deployment refs to main, disable bypass.
# 3. Verify that protection via admin UI/API; then set repository variable
#    REFOCUS_SIGNING_ENABLED=I_VERIFIED_ENVIRONMENT_AND_BRANCH_PROTECTION.
# 4. Obtain the real signing certificate, independently verify it, replace BOTH
#    SET_FIXED_* literals with the exact SHA-1 thumbprint and exact Subject in a
#    reviewed default-branch commit. Set REFOCUS_MSIX_EXPECTED_SUBJECT to that
#    exact subject. Add HERMES_MSIX_PFX_B64 and HERMES_MSIX_PFX_PASSWORD only
#    as environment secrets on refocus-signed-canary.
# GitHub Actions cannot prove a named environment has required reviewers from
# YAML alone; the explicit unset-by-default variable is an administrative gate,
# not a cryptographic guarantee. Do not set it until every external check passes.
# This workflow remains unactivated: do not dispatch, add secrets, or import certs.
